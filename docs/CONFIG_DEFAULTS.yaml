# Global defaults for Tri-ARC orchestration.
# Override values per experiment using config fragments located under configs/.

global:
  seed: 1337
  device_map:
    llm: cuda:0
    ttt: cuda:1
    symbolic: cuda:2
    flex: cuda:3
  max_wall_clock_hours: 12
  data_root: data/arcagi2
  cache_root: cache
  log_root: logs

modules:
  symbolic:
    class: arc.symbolic.SymbolicModule
    enabled: ${symbolic.enabled}
    device: ${global.device_map.symbolic}
    migration_log_path: reports/module_interface_migration.md
    warm_start: true
  ttt:
    class: arc.ttt.TTTModule
    enabled: ${ttt.enabled}
    device: ${global.device_map.ttt}
    mock_class: arc.ttt.mocks.MockTTTModule
    warm_start: false
  llm:
    class: arc.llm.LLMModule
    enabled: ${llm.enabled}
    device: ${global.device_map.llm}
    mock_class: arc.llm.mocks.MockLLMModule
    warm_start: false
  arbitrator:
    class: arc.arbitration.ArbitratorModule
    enabled: true

scheduler:
  feature_lookup: configs/scheduler/features.yaml
  default_soft_timeout_s: 90
  default_hard_timeout_s: 150
  priority_threshold: 0.65
  donation_window_s: 15
  backlog_alert_threshold: 50
  halt_threshold: 0.95
  feature_cache:
    max_items: 512
    ttl_seconds: 43200
    backing_store: cache/scheduler/features_cache.jsonl
  descriptor_cache:
    max_items: 256
  warm_start_cache:
    max_items: 128
  logging:
    ingest_log: logs/scheduler/ingest.log
  diagnostics:
    fingerprint_salt: scheduler_v1
    snapshot_dir: reports
  resource_pool:
    gpu_capacity: 1.0
    cpu_worker_capacity: 16

symbolic:
  enabled: true
  seed: 1337
  search_strategy: beam
  max_depth: 16
  max_expansions: 5000
  max_nodes: 40000
  beam_width: 96
  beam_width_minimum: 16
  soft_timeout_s: 90
  hard_timeout_s: 150
  heuristics_model_path: models/symbolic/heuristic.pt
  heuristics:
    mode: hybrid
    rule_based:
      enabled: true
      weight: 1.0
      weights:
        coverage: 2.0
        consistency: 1.5
        progress: 1.0
        novelty: 0.5
        depth_penalty: 1.0
        cost_penalty: 0.2
        stagnation_penalty: 0.5
        normalise_scale: 1.0
    neural:
      enabled: true
      weight: 1.0
      model_path: models/symbolic/heuristic.pt
      checksum_path: models/symbolic/heuristic.sha256
      requires_checksum: false
    calibration:
      enabled: true
      midpoint: auto
      scale: 0.45
      min_score: 0.0
      max_score: 1.0
  
  # IR Layer Configuration
  ir:
    enabled: false
    connectivity: 4
    min_object_size: 1
  
  # SMT Gateway Configuration
  smt:
    enabled: false
    timeout_per_candidate: 2.0
    issue_tokens: true
    token_prefix: "smt:virtual-symbolic:"
    virtual_secret: "tri-arc"
    enable_bdd: false
  
  # Symmetry and Normalization
  symmetry:
    enabled: false
    color_normalization: true
    color_normalization_strategy: frequency
    symmetry_detection: true
    step_normalization: true
    quotient_search: false
  
  # CEGIS and Verification
  cegis:
    enabled: false
    max_iterations: 10
    enable_counterexample_minimization: true
    enable_invariant_checking: true
    enable_program_repair: true
    enable_multi_solution_arbitration: true
  
  # Decomposition
  decomposition:
    enabled: false
    enable_object_centric: true
    enable_parallel_synthesis: true
    enable_block_operations: true
  
  # Coordination with TTT/LLM
  coordination:
    enabled: false
    enable_ttt_coordination: true
    enable_llm_coordination: true
    message_queue_size: 100
  
  # Advanced Search Strategies
  advanced_search:
    enabled: false
    search_strategy: beam  # beam, sketch_guided, pcfg, mcts
    enable_sketch_guided: false
    enable_abstract_interpretation: false
    enable_pcfg: false
    enable_mcts: false
    enable_diversity_control: true
    sketch_guided:
      top_k_sketches: 5
      max_candidates_per_sketch: 10
    pcfg:
      temperature: 1.0
      beam_width: 10
    mcts:
      exploration_constant: 1.414
      num_simulations: 100
    diversity:
      semantic_distance_threshold: 0.1
      edit_distance_threshold: 3
  
  # DSL Library Management
  library:
    enabled: false
    library_dir: cache/symbolic/library
    fragment_mining:
      enabled: true
      min_frequency: 2
      min_complexity_reduction: 0.1
    rule_learning:
      enabled: true
      min_support: 3
      validation_split: 0.2
    curation:
      enable_ab_testing: true
      enable_versioning: true
    pruning:
      enabled: true
      interval: 100
      usage_threshold: 0.01
      impact_threshold: 0.05
  
  # Engineering Infrastructure
  engineering:
    enabled: false
    cache:
      enable_program_cache: true
      enable_fragment_cache: true
      enable_verification_cache: true
      max_cache_size: 10000
      eviction_policy: lru
    budget:
      enable_adaptive_budget: true
      base_depth: 12
      base_expansions: 5000
      grid_size_factor: 1.5
      symmetry_factor: 0.8
      complexity_factor: 1.2
    telemetry:
      enable_structured_logging: true
      enable_metrics_collection: true
      metrics_file: logs/metrics.jsonl
      enable_event_tracing: true
    circuit_breaker:
      enable_smt_circuit_breaker: true
      failure_threshold: 5
      timeout_threshold_s: 10.0
      reset_timeout_s: 60.0
      ema_alpha: 0.2
  egraph:
    enabled: true
    rewrite_limit: 5000
    cost_metric: min_nodes
    max_iterations: 50
    history_dir: logs/symbolic/egraph
  frontier:
    report_dir: reports/symbolic
    log_path: logs/symbolic/symbolic_frontier.log
    snapshot_interval_s: 5.0
  telemetry:
    progress_file: logs/symbolic/solve_progress.jsonl
    diagnostics_dir: logs/symbolic/diagnostics
    checkpoint_dir: cache/symbolic/checkpoints
  library_path: dsl/library.json
  interpreter_cache:
    enabled: true
    max_items: 512
    ttl_seconds: 43200
  smt:
    issue_tokens: true
    token_prefix: "smt:virtual-symbolic:"
    virtual_secret: "tri-arc-symbolic"

ttt:
  enabled: true
  model_path: models/ttt/base.ckpt
  trainable_params: adapters
  steps: 16
  learning_rate: 3.0e-4
  gradient_clip: 1.0
  early_stop_patience: 3
  losses:
    reconstruction: 1.0
    color_conservation: 0.5
    object_count: 0.3
    smoothness: 0.2

llm:
  enabled: true
  backend: auto
  model_path: models/Qwen2.5-Coder-7B-Instruct
  tokenizer_path: models/Qwen2.5-Coder-7B-Instruct
  prompt_version: dsl-v1
  initial_candidates: 8
  refinement_candidates: 4
  temperature_initial: 0.7
  top_p_initial: 0.9
  max_input_tokens: 1536
  max_new_tokens: 512
  quantisation_bits: 4
  keep_failed_candidates: false
  stop_sequences:
    - "</json>"
    - "</response>"
    - "<|im_end|>"
  prompt_variants:
    - name: planner
      weight: 1.0
    - name: symmetry
      weight: 0.8
    - name: contrast
      weight: 0.6
  smt:
    issue_tokens: true
    token_prefix: "smt:virtual-llm:"
    virtual_secret: "tri-arc-llm"

smt:
  enabled: false
  token_prefix: "smt:virtual-symbolic:"
  solver: z3
  timeout_ms: 2000
  max_retries: 2
  reuse_context: true
  max_clause_cache: 10000
  clause_cache_max_items: 2048

arbitrator:
  confidence_threshold: 0.65
  diversity_gap: 0.1
  runtime_penalty_weight: 0.05
  log_top_k: 5
  default_prior: 0.5
  diversity_bonus: 0.05
  module_priors:
    symbolic: 0.75
    ttt: 0.5
    llm: 0.45
  outputs_dir: outputs
  reports_dir: reports
  logs_dir: logs/arbitrator
  verification_batch_size: 1

logging:
  level: INFO
  metrics_file: metrics.jsonl
  runtime_log: runtime.log
  profiler_enabled: false
  compress_rotated_logs: true
  log_max_bytes_mb: 5
  log_backup_count: 3

guardrails:
  max_duration_s: 300
  max_rss_mb: 110000
  max_gpu_mb: 23000
  scheduler:
    feature_cache_min_hit_rate: 0.2
    descriptor_cache_min_hit_rate: 0.2
  smt:
    clause_cache_miss_threshold: 0.7

debug:
  enable_replay_cache: true
  store_failed_candidates: true
  dump_smt_constraints: true

  # Symbolic Synthesis Enhancements (v1.0.0)
  
  # IR Layer
  ir:
    enabled: true
    connectivity: 4
    min_object_size: 1
    background_color: 0
    
  # E-graph Enhancement
  egraph:
    enabled: true
    rewrite_limit: 5000
    max_iterations: 50
    cost_metric: min_nodes
    extraction_method: ilp
    tiering:
      enabled: true
      hot_interval: 1
      warm_interval: 5
      cold_interval: 10
    history_dir: logs/symbolic/egraph
    
  # DSL Library Management
  library:
    fragment_mining:
      enabled: true
      min_frequency: 2
      min_utility: 0.1
      max_fragments: 1000
    rule_learning:
      enabled: true
      validation_threshold: 0.8
      min_support: 3
      max_rules: 500
    pruning:
      enabled: true
      usage_threshold: 0.01
      impact_threshold: 0.05
      prune_interval_days: 7
    persistence:
      library_path: models/symbolic/dsl_library.json
      backup_interval_hours: 24
      max_backups: 10
      
  # CEGIS
  cegis:
    enabled: true
    max_iterations: 10
    minimize_counterexamples: true
    check_invariants: true
    invariants:
      - color_conservation
      - object_count
      - topology
      
  # SMT Gateway
  smt:
    enabled: true
    timeout_per_candidate: 2.0
    batch_size: 10
    solver: z3
    issue_tokens: true
    parallel: true
    cache_results: true
    witness_functions:
      enabled: true
      backward_propagation: true
      
  # Symmetry & Normalization
  symmetry:
    color_normalization: true
    symmetry_detection: true
    detect_reflection: true
    detect_rotation: true
    detect_dihedral: true
    step_normalization: true
    
  # Advanced Search
  search:
    sketch_guided: true
    abstract_interpretation: true
    pcfg_enabled: false
    mcts_enabled: false
    diversity_control: true
    
  # Decomposition
  decomposition:
    object_centric: true
    parallel_synthesis: true
    
  # Module Coordination
  coordination:
    ttt:
      enabled: true
      receive_invariants: true
      send_feedback: true
      timeout_s: 5.0
    llm:
      enabled: true
      receive_macros: true
      receive_sketches: true
      verify_candidates: true
      timeout_s: 5.0
    fallback_on_failure: true
    
  # Engineering Infrastructure
  engineering:
    cache:
      enabled: true
      max_size: 10000
      eviction_policy: lru
    adaptive_budget:
      enabled: true
      grid_size_factor: 1.5
      symmetry_factor: 1.3
      complexity_factor: 0.8
    timeout_guard:
      enabled: true
      cooperative_cancellation: true
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      timeout_threshold: 10
      reset_timeout_s: 60.0
      
  # Telemetry
  telemetry:
    progress_file: logs/symbolic/solve_progress.jsonl
    diagnostics_dir: logs/symbolic/diagnostics
    checkpoint_dir: cache/symbolic/checkpoints
    frontier_log: logs/symbolic/symbolic_frontier.log
    report_dir: reports/symbolic
    
  # Cost Model
  cost_model:
    weights:
      length: 1.0
      complexity: 0.5
      generality: -2.0
      execution: 0.3
    operator_complexity:
      identity: 0.0
      rotate: 1.0
      reflect_h: 1.0
      reflect_v: 1.0
      transpose: 1.0
      replace_colour: 1.5
      flood_fill: 2.5
      paint_region: 1.5
      extract_region: 1.5
      detect_objects: 2.0
      compose: 0.5
      repeat: 1.0
      if_equal: 2.0
      fold: 3.0

